name: Manual — GA4 weekly fallback

# Manual-only fallback runner for ga4_weekly.py. Use when the main updater
# is broken and you need a quick read on the week without touching the
# analysis DB. No schedule — workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD), optional"
        required: false
      end:
        description: "End date (YYYY-MM-DD), optional"
        required: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-analytics-data \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Restore GA4 token from secret
        env:
          GA4_TOKEN_JSON: ${{ secrets.GA4_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$GA4_TOKEN_JSON" > .secrets/ga4_token.json
          chmod 600 .secrets/*.json

      - name: Run ga4_weekly.py
        env:
          GA4_TOKEN_PATH: ${{ github.workspace }}/.secrets/ga4_token.json
          GA4_ANALYSIS_DB_PATH: ${{ github.workspace }}/ga4_analysis.db
          GA4_HEADLESS: "1"
        run: |
          if [ -n "${{ github.event.inputs.start }}" ] && [ -n "${{ github.event.inputs.end }}" ]; then
            python ga4_weekly.py --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}"
          else
            python ga4_weekly.py
          fi

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-weekly-outputs
          path: |
            *.csv
            *.json
            !.secrets/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Wipe credentials
        if: always()
        run: rm -rf .secrets
