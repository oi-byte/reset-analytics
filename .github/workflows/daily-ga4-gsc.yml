name: Daily GA4 + GSC pull

on:
  schedule:
    # 10:30 UTC daily. GA4 may revise recent days for late-arriving attribution;
    # the cloud-mode script always re-pulls current month-to-date.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD), optional"
        required: false
      end:
        description: "End date (YYYY-MM-DD), optional"
        required: false

concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-analytics-data \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Restore credentials from secrets
        env:
          GA4_TOKEN_JSON: ${{ secrets.GA4_TOKEN_JSON }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$GA4_TOKEN_JSON" > .secrets/ga4_token.json
          printf '%s' "$GSC_SA_JSON"   > .secrets/gsc_sa.json
          chmod 600 .secrets/*.json

      - name: Run GA4 + GSC cloud-mode pull
        env:
          GA4_TOKEN_PATH: ${{ github.workspace }}/.secrets/ga4_token.json
          GSC_SERVICE_ACCOUNT_PATH: ${{ github.workspace }}/.secrets/gsc_sa.json
          GA4_ANALYSIS_DB_PATH: ${{ github.workspace }}/ga4_analysis.db
          GA4_HEADLESS: "1"
        run: |
          if [ -n "${{ github.event.inputs.start }}" ] && [ -n "${{ github.event.inputs.end }}" ]; then
            python GA_Search_Console_DB_updater.py --cloud-mode \
              --start "${{ github.event.inputs.start }}" \
              --end   "${{ github.event.inputs.end }}"
          else
            python GA_Search_Console_DB_updater.py --cloud-mode
          fi

      - name: Wipe credentials
        if: always()
        run: rm -rf .secrets

      - name: Commit updated analysis DB
        run: |
          git config user.name  "reset-analytics-bot"
          git config user.email "reset-analytics-bot@users.noreply.github.com"
          git add ga4_analysis.db
          if git diff --staged --quiet; then
            echo "No changes to ga4_analysis.db — skipping commit."
          else
            git commit -m "daily GA4+GSC refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
